<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#07132d" />
<title>Dan Cell | Catálogo Online</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0e1830;--muted:#67738b;--navy:#07132d;--blue:#0b63f6;--cyan:#17c9ff;--line:#e6ebf2;--success:#12a05c;--danger:#d84040;--shadow:0 12px 35px rgba(7,19,45,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#061127,#0b2c68 62%,#0b63f6);color:white;padding:24px 18px 70px;position:relative;overflow:hidden}.top:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;border:50px solid rgba(23,201,255,.13);right:-80px;top:-90px}.wrap{max-width:1120px;margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{display:flex;align-items:center;gap:11px;font-weight:900;font-size:24px;letter-spacing:.6px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;box-shadow:0 8px 24px rgba(23,201,255,.25)}.mark svg{width:26px}.adminTop{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:white;border-radius:12px;padding:10px 14px}.hero{padding:52px 0 0;max-width:680px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:.98;margin:0 0 14px}.hero p{font-size:17px;color:#d8e5ff;max-width:580px;margin:0}.toolbar{max-width:1120px;margin:-35px auto 0;position:relative;padding:0 18px}.toolbox{background:white;border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:240px;position:relative}.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 15px 0 44px;outline:none}.search svg{position:absolute;left:15px;top:14px;width:20px;stroke:#7d879a}.cat{height:48px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:#fff}.content{max-width:1120px;margin:34px auto;padding:0 18px 50px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.sectionTitle h2{margin:0;font-size:25px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(7,19,45,.05);display:flex;flex-direction:column}.pic{aspect-ratio:1/1;background:#edf2f8;display:grid;place-items:center;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:rgba(7,19,45,.88);color:white;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.body{padding:15px;display:flex;flex-direction:column;flex:1}.name{font-weight:850;font-size:17px;margin-bottom:5px}.desc{color:var(--muted);font-size:13px;line-height:1.45;min-height:38px}.price{font-size:22px;font-weight:900;margin:14px 0 2px}.installment{color:var(--blue);font-size:12px;font-weight:700}.buy{margin-top:14px;border:0;background:var(--navy);color:white;padding:12px;border-radius:12px;font-weight:800}.empty{grid-column:1/-1;text-align:center;background:white;border:1px dashed #ccd4df;border-radius:18px;padding:45px 20px;color:var(--muted)}
footer{background:#061127;color:#d8e5ff;padding:28px 18px}.foot{max-width:1120px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.foot b{color:white}.modal{position:fixed;inset:0;background:rgba(1,8,24,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.panel{background:white;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.32)}.panelHead{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:2}.panelHead h3{margin:0}.close{border:0;background:#eef2f7;border-radius:10px;width:38px;height:38px}.panelBody{padding:20px}.loginBox{max-width:400px;margin:25px auto}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{border:0;background:var(--blue);color:white;border-radius:11px;padding:12px 16px;font-weight:800}.secondary{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 14px;font-weight:750}.danger{border:0;background:#fff0f0;color:var(--danger);border-radius:9px;padding:8px 10px}.adminList{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.adminItem{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.adminItem img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#eef2f7}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#07132d;color:white;padding:12px 16px;border-radius:12px;transition:.25s;z-index:70}.toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.top{padding-bottom:58px}.hero{padding-top:40px}.row{grid-template-columns:1fr}.card{border-radius:16px}.body{padding:12px}.name{font-size:15px}.price{font-size:19px}.brand .adminTop{font-size:12px;padding:8px 10px}}@media(max-width:410px){.grid{grid-template-columns:1fr}.pic{aspect-ratio:1.3/1}}
  #adminModal:target{
  display:flex !important;
  opacity:1 !important;
  visibility:visible !important;
  position:fixed !important;
  inset:0 !important;
  z-index:99999 !important;
  </style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9 6h6M10 18h4"/></svg></span>DAN CELL</div>
<a class="adminTop" href="#adminModal" onclick="drawAdmin()">Área do lojista</a>
    <div class="hero"><h1>Seu próximo aparelho está aqui.</h1><p>Confira ofertas, compare modelos e fale diretamente com a Dan Cell pelo WhatsApp.</p></div>
  </div>
</header>
<div class="toolbar"><div class="toolbox">
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input id="search" placeholder="Buscar produto, marca ou modelo..." oninput="render()"></div>
  <select class="cat" id="category" onchange="render()"><option value="Todos">Todas as categorias</option></select>
</div></div>
<main class="content"><div class="sectionTitle"><h2>Produtos</h2><span class="count" id="count"></span></div><section class="grid" id="grid"></section></main>
<footer><div class="foot"><div><b>Dan Cell</b><div class="small" style="color:#9fb0cc;margin-top:5px">Tecnologia, acessórios e assistência.</div></div><div><b>WhatsApp:</b> (74) 98145-2762<br><span class="small" style="color:#9fb0cc">Rua Santa Inês, 186 • Antônio Conselheiro</span></div></div></footer>
<div class="modal" id="adminModal"><div class="panel"><div class="panelHead"><h3>Painel da Dan Cell</h3><button class="close" onclick="closeAdmin()">✕</button></div><div class="panelBody" id="adminBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const WHATSAPP='5574981452762';
let products=[]; let logged=false; let editing=null; let adminPin=''; let online=false;
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadProducts(){
  try{const r=await fetch('/api/products',{cache:'no-store'});const d=await r.json();products=d.products||[];online=!!d.online;render();}
  catch(e){document.getElementById('grid').innerHTML='<div class="empty">Não foi possível carregar o catálogo.</div>'}
}
function renderCats(){const s=document.getElementById('category');const current=s.value;const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort();s.innerHTML='<option value="Todos">Todas as categorias</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');if([...s.options].some(o=>o.value===current))s.value=current}
function render(){renderCats();const q=document.getElementById('search').value.toLowerCase().trim(),c=document.getElementById('category').value;const filtered=products.filter(p=>(c==='Todos'||p.category===c)&&(`${p.name} ${p.category} ${p.desc}`.toLowerCase().includes(q)));document.getElementById('count').textContent=`${filtered.length} ${filtered.length===1?'item':'itens'}`;document.getElementById('grid').innerHTML=filtered.length?filtered.map(p=>`<article class="card"><div class="pic"><img src="${esc(p.image||'')}" alt="${esc(p.name)}" onerror="this.style.display='none'"><span class="badge">${esc(p.category)}</span></div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc||'')}</div><div class="price">${esc(p.price||'Consulte')}</div><div class="installment">${esc(p.installment||'')}</div><button class="buy" onclick="buy(${Number(p.id)})">Pedir no WhatsApp</button></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}
function buy(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;const text=encodeURIComponent(`Olá, Dan Cell! Tenho interesse no produto: ${p.name}. Poderia me passar mais informações?`);window.open(`https://wa.me/${WHATSAPP}?text=${text}`,'_blank')}function closeAdmin(){document.getElementById('adminModal').classList.remove('open');editing=null}
function openAdmin(){
  const m = document.getElementById('adminModal');
  m.style.display = 'flex';
  m.classList.add('open');
  drawAdmin();
}function drawAdmin(){const b=document.getElementById('adminBody');if(!logged){b.innerHTML=`<div class="loginBox"><h2>Acesso do lojista</h2><p class="small">Digite seu PIN para gerenciar o catálogo.</p><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="••••"></div><button class="primary" style="width:100%" onclick="login()">Entrar</button><p class="small" style="margin-top:14px">Seu PIN é validado no servidor.</p></div>`;return}const p=editing?products.find(x=>Number(x.id)===Number(editing)):{};b.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2>${editing?'Editar produto':'Adicionar produto'}</h2><span class="small">${online?'● Online':'○ Banco não conectado'}</span></div><div class="row"><div class="field"><label>Nome</label><input id="fName" value="${esc(p.name||'')}" placeholder="Ex.: Redmi Note 15"></div><div class="field"><label>Categoria</label><input id="fCat" value="${esc(p.category||'')}" placeholder="Ex.: Xiaomi"></div></div><div class="row"><div class="field"><label>Preço / condição principal</label><input id="fPrice" value="${esc(p.price||'')}" placeholder="Ex.: Entrada R$ 500 + 7x R$ 220"></div><div class="field"><label>Texto secundário</label><input id="fInst" value="${esc(p.installment||'')}" placeholder="Ex.: Na promissória"></div></div><div class="field"><label>Descrição</label><textarea id="fDesc" rows="3">${esc(p.desc||'')}</textarea></div><div class="field"><label>URL da foto</label><input id="fImage" value="${esc(p.image||'')}" placeholder="https://..."></div><div style="display:flex;gap:8px"><button class="primary" onclick="submitProduct()">${editing?'Salvar alterações':'Adicionar produto'}</button>${editing?'<button class="secondary" onclick="cancelEdit()">Cancelar</button>':''}</div><div class="adminList"><h3>Produtos cadastrados</h3>${products.map(x=>`<div class="adminItem"><img src="${esc(x.image||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(x.name)}</b><div class="small">${esc(x.category)} • ${esc(x.price)}</div></div><div class="actions"><button class="secondary" onclick="editProduct(${Number(x.id)})">Editar</button><button class="danger" onclick="removeProduct(${Number(x.id)})">Excluir</button></div></div>`).join('')}</div>`}
async function login(){const pin=document.getElementById('pin').value;try{const r=await fetch('/api/products?action=login',{method:'POST',headers:{'x-admin-pin':pin}});if(!r.ok)return toast('PIN incorreto');adminPin=pin;logged=true;drawAdmin()}catch(e){toast('Erro ao entrar')}}
async function persist(next){const r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-pin':adminPin},body:JSON.stringify({products:next})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro ao salvar');products=next;online=true;render();}
async function submitProduct(){const name=document.getElementById('fName').value.trim();if(!name)return toast('Digite o nome do produto');const obj={name,category:document.getElementById('fCat').value.trim()||'Outros',price:document.getElementById('fPrice').value.trim()||'Consulte',installment:document.getElementById('fInst').value.trim(),desc:document.getElementById('fDesc').value.trim(),image:document.getElementById('fImage').value.trim()};let next=[...products];if(editing){const i=next.findIndex(x=>Number(x.id)===Number(editing));next[i]={...next[i],...obj};}else next.unshift({...obj,id:Date.now()});try{await persist(next);editing=null;drawAdmin();toast('Produto salvo online')}catch(e){toast(e.message)}}
function editProduct(id){editing=id;drawAdmin();document.querySelector('.panel').scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){editing=null;drawAdmin()}async function removeProduct(id){if(!confirm('Excluir este produto?'))return;try{await persist(products.filter(x=>Number(x.id)!==Number(id)));drawAdmin();toast('Produto excluído')}catch(e){toast(e.message)}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
document.getElementById('adminModal').addEventListener('click',e=>{if(e.target.id==='adminModal')closeAdmin()});loadProducts();
</script>
</body>
</html>
