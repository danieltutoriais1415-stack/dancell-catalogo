<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07132d">
  <title>Dan Cell | Catálogo Online</title>

  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --ink:#0e1830;
      --muted:#67738b;
      --navy:#07132d;
      --blue:#0b63f6;
      --cyan:#17c9ff;
      --line:#e6ebf2;
      --danger:#d92d20;
      --shadow:0 14px 40px rgba(5,21,53,.12);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
    }

    button,input,select,textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .top{
      color:white;
      background:linear-gradient(135deg,#061633,#0b2f70 60%,#0863e7);
    }

    .wrap{
      max-width:1180px;
      margin:auto;
      padding:26px 22px 50px;
    }

    .brandRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:28px;
      font-weight:900;
    }

    .mark{
      width:48px;
      height:48px;
      border-radius:14px;
      background:linear-gradient(145deg,#18d5ff,#0877ff);
      display:grid;
      place-items:center;
      font-size:28px;
    }

    .adminTop{
      border:1px solid rgba(255,255,255,.35);
      background:rgba(255,255,255,.08);
      color:#fff;
      padding:12px 16px;
      border-radius:14px;
      font-weight:700;
    }

    .hero{
      padding:60px 0 30px;
      max-width:760px;
    }

    .hero h1{
      margin:0 0 18px;
      font-size:62px;
      line-height:1;
    }

    .hero p{
      margin:0;
      font-size:20px;
      color:rgba(255,255,255,.85);
    }

    .toolbar{
      max-width:1180px;
      margin:-28px auto 0;
      padding:0 22px;
    }

    .toolbox{
      background:white;
      border-radius:22px;
      padding:18px;
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:1fr 260px;
      gap:12px;
    }

    .toolbox input,
    .toolbox select{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:15px;
      background:white;
    }

    .content{
      max-width:1180px;
      margin:auto;
      padding:55px 22px 30px;
    }

    .sectionTitle{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .sectionTitle h2{
      margin:0;
      font-size:32px;
    }

    .count{
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }

    .photo{
      aspect-ratio:4/3;
      background:#e8edf5;
      position:relative;
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .badge{
      position:absolute;
      top:12px;
      left:12px;
      background:#0a1d4a;
      color:#fff;
      padding:7px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:700;
    }

    .body{
      padding:16px;
    }

    .name{
      margin:0 0 8px;
      font-size:20px;
    }

    .desc{
      color:var(--muted);
      min-height:42px;
    }

    .price{
      font-size:22px;
      font-weight:900;
      margin-top:10px;
    }

    .sub{
      color:#1764d8;
      font-size:12px;
      font-weight:700;
      margin:4px 0 12px;
    }

    .wa{
      display:block;
      text-align:center;
      background:var(--navy);
      color:white;
      text-decoration:none;
      padding:13px;
      border-radius:12px;
      font-weight:700;
    }

    footer{
      background:#061127;
      color:white;
      margin-top:30px;
    }

    .foot{
      max-width:1180px;
      margin:auto;
      padding:24px 22px;
      display:flex;
      justify-content:space-between;
      gap:20px;
    }

    .small{
      font-size:12px;
      color:#aab5c8;
      margin-top:5px;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(5,16,39,.7);
      z-index:99999;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .modal.open{
      display:flex;
    }

    .panel{
      width:min(720px,100%);
      max-height:90vh;
      overflow:auto;
      background:white;
      border-radius:20px;
    }

    .panelHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px;
      border-bottom:1px solid var(--line);
    }

    .panelHead h3{
      margin:0;
    }

    .close{
      width:38px;
      height:38px;
      border:none;
      border-radius:10px;
      background:#f0f3f7;
      font-size:22px;
    }

    .adminBody{
      padding:20px;
    }

    .loginBox{
      max-width:420px;
      margin:auto;
    }

    .loginBox h2{
      margin-top:0;
    }

    .field{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:13px;
      margin-bottom:12px;
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:13px 15px;
      font-weight:700;
    }

    .btnPrimary{
      background:var(--navy);
      color:white;
      width:100%;
    }

    .adminActions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .adminActions .btn{
      background:#eef3f9;
    }

    .adminList{
      display:grid;
      gap:12px;
    }

    .adminItem{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      background:#111827;
      color:white;
      padding:12px 16px;
      border-radius:10px;
      display:none;
      z-index:100000;
    }

    .toast.show{
      display:block;
    }

    @media(max-width:800px){
      .grid{
        grid-template-columns:repeat(2,1fr);
      }

      .hero h1{
        font-size:48px;
      }
    }

    @media(max-width:600px){
      .wrap{
        padding:18px 14px 40px;
      }

      .brand{
        font-size:20px;
      }

      .mark{
        width:40px;
        height:40px;
      }

      .adminTop{
        padding:10px 12px;
        font-size:13px;
      }

      .hero{
        padding:45px 0 20px;
      }

      .hero h1{
        font-size:42px;
      }

      .hero p{
        font-size:16px;
      }

      .toolbar{
        padding:0 14px;
      }

      .toolbox{
        grid-template-columns:1fr;
      }

      .content{
        padding:45px 14px 25px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .foot{
        display:block;
      }
    }
  </style>
</head>

<body>

<header class="top">
  <div class="wrap">

    <div class="brandRow">
      <div class="brand">
        <div class="mark">▣</div>
        DAN CELL
      </div>

      <button id="openAdminBtn" class="adminTop">
        Área do lojista
      </button>
    </div>

    <div class="hero">
      <h1>Seu próximo aparelho está aqui.</h1>
      <p>
        Confira ofertas, compare modelos e fale diretamente com a Dan Cell pelo WhatsApp.
      </p>
    </div>

  </div>
</header>

<section class="toolbar">
  <div class="toolbox">
    <input
      id="search"
      type="search"
      placeholder="Buscar produto, marca ou modelo..."
    >

    <select id="category">
      <option value="Todos">Todas as categorias</option>
    </select>
  </div>
</section>

<main class="content">

  <div class="sectionTitle">
    <h2>Produtos</h2>
    <span id="count" class="count">0 itens</span>
  </div>

  <section id="grid" class="grid"></section>

</main>

<footer>
  <div class="foot">

    <div>
      <strong>Dan Cell</strong>
      <div class="small">
        Tecnologia, acessórios e assistência.
      </div>
    </div>

    <div>
      <strong>WhatsApp: (74) 98145-2762</strong>
      <div class="small">
        Rua Santa Inês, 186 • Antônio Conselheiro
      </div>
    </div>

  </div>
</footer>

<div id="adminModal" class="modal">

  <div class="panel">

    <div class="panelHead">
      <h3>Painel da Dan Cell</h3>
      <button id="closeAdminBtn" class="close">×</button>
    </div>

    <div id="adminBody" class="adminBody"></div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const WHATSAPP = "5574981452762";

let products = [];
let logged = false;
let adminPin = "";

const fallbackProducts = [
  {
    id:1,
    name:"Redmi Note 15",
    brand:"Xiaomi",
    category:"Xiaomi",
    description:"Desempenho, bateria e ótimo custo-benefício.",
    price:"Consulte",
    installment:"Peça sua condição de pagamento",
    image:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=900&q=80"
  },
  {
    id:2,
    name:"iPhone 13 128GB",
    brand:"iPhone",
    category:"iPhone",
    description:"Qualidade Apple com excelente conjunto de câmeras.",
    price:"Consulte",
    installment:"Parcelamento disponível",
    image:"https://images.unsplash.com/photo-1605236453806-6ff36851218e?auto=format&fit=crop&w=900&q=80"
  },
  {
    id:3,
    name:"Caixa de Som Bluetooth",
    brand:"Acessórios",
    category:"Acessórios",
    description:"Som potente e portátil para o dia a dia.",
    price:"Consulte",
    installment:"Fale conosco pelo WhatsApp",
    image:"https://images.unsplash.com/photo-1589003077984-894e133dabab?auto=format&fit=crop&w=900&q=80"
  }
];

function $(id){
  return document.getElementById(id);
}

function toast(text){
  $("toast").textContent = text;
  $("toast").classList.add("show");

  setTimeout(()=>{
    $("toast").classList.remove("show");
  },2500);
}

function esc(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

async function loadProducts(){

  try{

    const r = await fetch("/api/products",{
      cache:"no-store"
    });

    if(!r.ok){
      throw new Error();
    }

    const data = await r.json();

    products = Array.isArray(data)
      ? data
      : data.products || [];

    if(!products.length){
      products = fallbackProducts;
    }

  }catch(e){

    products = fallbackProducts;

  }

  renderCategories();
  renderProducts();
}

function renderCategories(){

  const cats = [
    ...new Set(
      products.map(p=>p.category || p.brand)
    )
  ];

  $("category").innerHTML =
    '<option value="Todos">Todas as categorias</option>' +
    cats.map(c=>
      `<option value="${esc(c)}">${esc(c)}</option>`
    ).join("");
}

function renderProducts(){

  const q = $("search").value.toLowerCase().trim();
  const cat = $("category").value;

  const list = products.filter(p=>{

    const text = [
      p.name,
      p.brand,
      p.category,
      p.description
    ].join(" ").toLowerCase();

    const textOk =
      !q ||
      text.includes(q);

    const catOk =
      cat === "Todos" ||
      p.category === cat ||
      p.brand === cat;

    return textOk && catOk;

  });

  $("count").textContent =
    `${list.length} ${list.length === 1 ? "item" : "itens"}`;

  if(!list.length){

    $("grid").innerHTML =
      "<div>Nenhum produto encontrado.</div>";

    return;
  }

  $("grid").innerHTML =
    list.map(p=>{

      const message =
        encodeURIComponent(
          `Olá, Dan Cell! Tenho interesse no ${p.name}.`
        );

      return `
        <article class="card">

          <div class="photo">

            ${
              p.image
              ? `<img src="${esc(p.image)}">`
              : ""
            }

            <span class="badge">
              ${esc(p.brand || p.category)}
            </span>

          </div>

          <div class="body">

            <h3 class="name">
              ${esc(p.name)}
            </h3>

            <p class="desc">
              ${esc(p.description)}
            </p>

            <div class="price">
              ${esc(p.price || "Consulte")}
            </div>

            <div class="sub">
              ${esc(p.installment || "Condições pelo WhatsApp")}
            </div>

            <a
              class="wa"
              target="_blank"
              href="https://wa.me/${WHATSAPP}?text=${message}"
            >
              Pedir no WhatsApp
            </a>

          </div>

        </article>
      `;

    }).join("");
}

function openAdmin(){

  $("adminModal").classList.add("open");

  document.body.style.overflow = "hidden";

  drawAdmin();
}

function closeAdmin(){

  $("adminModal").classList.remove("open");

  document.body.style.overflow = "";
}

function drawAdmin(){

  if(!logged){

    $("adminBody").innerHTML = `
      <div class="loginBox">

        <h2>Acesso do lojista</h2>

        <p>
          Digite o PIN administrativo.
        </p>

        <input
          id="pin"
          class="field"
          type="password"
          placeholder="PIN"
        >

        <button
          id="loginBtn"
          class="btn btnPrimary"
        >
          Entrar
        </button>

      </div>
    `;

    $("loginBtn").onclick = login;

    return;
  }

  $("adminBody").innerHTML = `

    <div class="adminActions">

      <button class="btn" onclick="loadProducts()">
        Atualizar catálogo
      </button>

      <button class="btn" onclick="logout()">
        Sair
      </button>

    </div>

    <div class="adminList">

      ${
        products.map(p=>`

          <div class="adminItem">

            <div>

              <strong>
                ${esc(p.name)}
              </strong>

              <div class="small">
                ${esc(p.category || p.brand)}
              </div>

            </div>

            <div>
              ${esc(p.price || "Consulte")}
            </div>

          </div>

        `).join("")
      }

    </div>

  `;
}

async function login(){

  const pin =
    $("pin").value.trim();

  if(!pin){

    toast("Digite o PIN.");

    return;
  }

  try{

    const r = await fetch(
      "/api/products?action=login",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          pin:pin
        })
      }
    );

    const data =
      await r.json();

    if(
      !r.ok ||
      data.ok === false ||
      data.success === false
    ){

      throw new Error(
        data.message ||
        data.error ||
        "PIN inválido."
      );
    }

    adminPin = pin;

    logged = true;

    drawAdmin();

    toast("Acesso liberado.");

  }catch(e){

    toast(
      e.message ||
      "Não foi possível entrar."
    );

  }
}

function logout(){

  logged = false;

  adminPin = "";

  drawAdmin();
}

$("openAdminBtn").onclick =
  openAdmin;

$("closeAdminBtn").onclick =
  closeAdmin;

$("adminModal").onclick =
  function(e){

    if(
      e.target ===
      $("adminModal")
    ){

      closeAdmin();

    }

  };

$("search").oninput =
  renderProducts;

$("category").onchange =
  renderProducts;

loadProducts();

</script>

</body>
</html>
