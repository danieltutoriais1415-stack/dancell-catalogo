<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07132d">
  <title>Dan Cell | Catálogo Online</title>

  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --ink:#0e1830;
      --muted:#67738b;
      --navy:#07132d;
      --blue:#0b63f6;
      --cyan:#17c9ff;
      --line:#e6ebf2;
      --danger:#d92d20;
      --shadow:0 14px 40px rgba(5,21,53,.12);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button,
    a{
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .top{
      position:relative;
      overflow:hidden;
      color:white;
      background:
        radial-gradient(circle at 88% 18%,rgba(23,201,255,.28),transparent 27%),
        linear-gradient(135deg,#061633,#0b2f70 60%,#0863e7);
    }

    .wrap{
      max-width:1180px;
      margin:auto;
      padding:26px 22px 54px;
    }

    .brandRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:28px;
      font-weight:900;
    }

    .mark{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      border-radius:15px;
      background:linear-gradient(145deg,#18d5ff,#0877ff);
    }

    .mark svg{
      width:27px;
      height:27px;
    }

    .adminTop{
      border:1px solid rgba(255,255,255,.30);
      color:white;
      background:rgba(255,255,255,.10);
      border-radius:15px;
      padding:12px 16px;
      font-weight:700;
    }

    .hero{
      max-width:760px;
      padding:65px 0 35px;
    }

    .hero h1{
      font-size:64px;
      line-height:1;
      margin:0 0 20px;
    }

    .hero p{
      color:rgba(255,255,255,.83);
      font-size:19px;
      line-height:1.45;
    }

    .toolbar{
      max-width:1180px;
      margin:-32px auto 0;
      padding:0 22px;
      position:relative;
      z-index:10;
    }

    .toolbox{
      display:grid;
      grid-template-columns:1fr 240px;
      gap:12px;
      padding:18px;
      background:white;
      border-radius:22px;
      box-shadow:var(--shadow);
    }

    .search input,
    .cat{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:15px;
      outline:none;
      background:white;
    }

    .content{
      max-width:1180px;
      margin:auto;
      padding:55px 22px 35px;
    }

    .sectionTitle{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .sectionTitle h2{
      margin:0;
      font-size:33px;
    }

    .count{
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 9px 25px rgba(12,33,71,.08);
    }

    .photo{
      position:relative;
      aspect-ratio:4/3;
      overflow:hidden;
      background:#e9eef6;
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .badge{
      position:absolute;
      top:12px;
      left:12px;
      background:#07132d;
      color:white;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }

    .body{
      padding:18px;
    }

    .name{
      margin:0 0 7px;
      font-size:20px;
    }

    .desc{
      color:var(--muted);
      min-height:42px;
      line-height:1.4;
    }

    .price{
      font-size:21px;
      font-weight:900;
      margin-top:12px;
    }

    .sub{
      color:#1764d8;
      font-size:13px;
      font-weight:700;
      margin:5px 0 14px;
    }

    .wa{
      display:block;
      text-align:center;
      background:#07132d;
      color:white;
      padding:13px;
      border-radius:12px;
      font-weight:800;
    }

    .empty{
      grid-column:1/-1;
      padding:35px;
      text-align:center;
      background:white;
      border-radius:18px;
      color:var(--muted);
    }

    footer{
      background:#061127;
      color:white;
      margin-top:25px;
    }

    .foot{
      max-width:1180px;
      margin:auto;
      padding:25px 22px;
      display:flex;
      justify-content:space-between;
      gap:20px;
    }

    .small{
      color:#9fb0cc;
      font-size:13px;
      margin-top:5px;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:99999;
      background:rgba(5,16,39,.68);
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .modal.open{
      display:flex;
    }

    .panel{
      width:min(760px,100%);
      max-height:94vh;
      overflow:auto;
      background:white;
      border-radius:22px;
      box-shadow:0 30px 80px rgba(0,0,0,.28);
    }

    .panelHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      padding:18px 20px;
      position:sticky;
      top:0;
      background:white;
      z-index:2;
    }

    .panelHead h3{
      margin:0;
    }

    .close{
      border:none;
      background:#f2f5f9;
      width:40px;
      height:40px;
      border-radius:12px;
      font-size:24px;
    }

    .adminBody{
      padding:20px;
    }

    .loginBox{
      max-width:450px;
      margin:auto;
    }

    .loginBox h2{
      font-size:30px;
      margin:5px 0 10px;
    }

    .loginBox p{
      color:var(--muted);
    }

    .stack{
      display:grid;
      gap:12px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .field{
      width:100%;
      border:1px solid var(--line);
      border-radius:13px;
      padding:14px;
      outline:none;
    }

    textarea.field{
      resize:vertical;
    }

    .btn{
      border:none;
      border-radius:13px;
      padding:14px 15px;
      font-weight:800;
    }

    .btnPrimary{
      background:#07132d;
      color:white;
    }

    .btnBlue{
      background:#0b63f6;
      color:white;
    }

    .btnGhost{
      background:#eef3f9;
      color:#26344f;
    }

    .btnDanger{
      background:#fff0ef;
      color:#d92d20;
    }

    .adminActions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .adminList{
      display:grid;
      gap:12px;
    }

    .adminItem{
      display:grid;
      grid-template-columns:70px 1fr auto;
      align-items:center;
      gap:12px;
      border:1px solid var(--line);
      border-radius:15px;
      padding:12px;
    }

    .adminItem img{
      width:70px;
      height:70px;
      object-fit:cover;
      background:#eef2f7;
      border-radius:11px;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
      margin-top:4px;
    }

    .itemBtns{
      display:flex;
      gap:7px;
    }

    .itemBtns button{
      border:none;
      padding:9px;
      border-radius:9px;
      font-weight:700;
    }

    .notice{
      color:var(--muted);
      font-size:13px;
      margin-top:10px;
    }

    .formTitle{
      font-weight:900;
      font-size:22px;
      margin-bottom:15px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translate(-50%,20px);
      background:#111827;
      color:white;
      padding:13px 17px;
      border-radius:12px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      z-index:100000;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media(max-width:800px){
      .hero h1{
        font-size:45px;
      }

      .grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .wrap{
        padding:18px 14px 45px;
      }

      .brand{
        font-size:20px;
      }

      .mark{
        width:42px;
        height:42px;
      }

      .adminTop{
        padding:10px 12px;
        font-size:13px;
      }

      .hero{
        padding:50px 0 25px;
      }

      .hero h1{
        font-size:43px;
      }

      .toolbar{
        padding:0 13px;
      }

      .toolbox{
        grid-template-columns:1fr;
      }

      .content{
        padding:48px 13px 25px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .row{
        grid-template-columns:1fr;
      }

      .foot{
        display:block;
      }

      .adminItem{
        grid-template-columns:58px 1fr;
      }

      .adminItem img{
        width:58px;
        height:58px;
      }

      .itemBtns{
        grid-column:1/-1;
      }

      .itemBtns button{
        flex:1;
      }
    }
  </style>
</head>

<body>

<header class="top">
  <div class="wrap">

    <div class="brandRow">

      <div class="brand">

        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <rect x="6" y="2.5" width="12" height="19" rx="2.2"></rect>
            <path d="M10 5h4M10 18.5h4"></path>
          </svg>
        </span>

        DAN CELL

      </div>

      <button
        class="adminTop"
        type="button"
        id="openAdminBtn">
        Área do lojista
      </button>

    </div>

    <div class="hero">
      <h1>Seu próximo aparelho está aqui.</h1>
      <p>
        Confira ofertas, compare modelos e fale diretamente
        com a Dan Cell pelo WhatsApp.
      </p>
    </div>

  </div>
</header>

<section class="toolbar">

  <div class="toolbox">

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Buscar produto, marca ou modelo...">
    </div>

    <select class="cat" id="category">
      <option value="Todos">Todas as categorias</option>
    </select>

  </div>

</section>

<main class="content">

  <div class="sectionTitle">
    <h2>Produtos</h2>
    <span class="count" id="count">0 itens</span>
  </div>

  <section class="grid" id="grid"></section>

</main>

<footer>

  <div class="foot">

    <div>
      <b>Dan Cell</b>
      <div class="small">
        Tecnologia, acessórios e assistência.
      </div>
    </div>

    <div>
      <b>WhatsApp: (74) 98145-2762</b>
      <div class="small">
        Rua Santa Inês, 186 • Antônio Conselheiro
      </div>
    </div>

  </div>

</footer>

<div
  class="modal"
  id="adminModal"
  aria-hidden="true">

  <div class="panel">

    <div class="panelHead">

      <h3>Painel da Dan Cell</h3>

      <button
        class="close"
        id="closeAdminBtn"
        type="button">
        ×
      </button>

    </div>

    <div
      class="adminBody"
      id="adminBody">
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

const WHATSAPP = "5574981452762";

let products = [];
let filtered = [];

let logged = false;
let adminPin = "";

let editingId = null;
let apiOnline = false;

const fallbackProducts = [

  {
    id:1,
    name:"Redmi Note 15",
    brand:"Xiaomi",
    category:"Xiaomi",
    description:"Desempenho, bateria e ótimo custo-benefício.",
    price:"Consulte",
    installment:"Peça sua condição de pagamento",
    image:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=900&q=80"
  },

  {
    id:2,
    name:"iPhone 13 128GB",
    brand:"iPhone",
    category:"iPhone",
    description:"Qualidade Apple com excelente conjunto de câmeras.",
    price:"Consulte",
    installment:"Parcelamento disponível",
    image:"https://images.unsplash.com/photo-1605236453806-6ff36851218e?auto=format&fit=crop&w=900&q=80"
  },

  {
    id:3,
    name:"Caixa de Som Bluetooth",
    brand:"Acessórios",
    category:"Acessórios",
    description:"Som potente e portátil para o dia a dia.",
    price:"Consulte",
    installment:"Fale conosco pelo WhatsApp",
    image:"https://images.unsplash.com/photo-1589003077984-894e133dabab?auto=format&fit=crop&w=900&q=80"
  }

];

const $ = id => document.getElementById(id);

function esc(value = ""){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function toast(message){

  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    el.classList.remove("show");
  },2500);

}

function normalizeProduct(p,index = 0){

  return {

    id:
      p.id ??
      p._id ??
      Date.now() + index,

    name:
      p.name ??
      p.nome ??
      "Produto",

    brand:
      p.brand ??
      p.marca ??
      p.category ??
      p.categoria ??
      "Dan Cell",

    category:
      p.category ??
      p.categoria ??
      p.brand ??
      p.marca ??
      "Outros",

    description:
      p.description ??
      p.desc ??
      p.descricao ??
      "",

    price:
      p.price ??
      p.preco ??
      "Consulte",

    installment:
      p.installment ??
      p.parcelamento ??
      "",

    image:
      p.image ??
      p.imagem ??
      p.photo ??
      ""

  };

}

async function loadProducts(){

  try{

    const r = await fetch(
      "/api/products",
      {
        cache:"no-store"
      }
    );

    if(!r.ok){
      throw new Error("API indisponível");
    }

    const data = await r.json();

    const lista =
      Array.isArray(data)
      ? data
      : data.products || [];

    products =
      lista.map(normalizeProduct);

    if(!products.length){
      products =
        fallbackProducts.map(normalizeProduct);
    }

    apiOnline = true;

  }catch(error){

    products =
      fallbackProducts.map(normalizeProduct);

    apiOnline = false;

  }

  renderCategories();
  applyFilters();

}

function renderCategories(){

  const atual =
    $("category").value ||
    "Todos";

  const cats = [
    ...new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    )
  ].sort();

  $("category").innerHTML =
    '<option value="Todos">Todas as categorias</option>' +
    cats.map(c =>
      `<option value="${esc(c)}">${esc(c)}</option>`
    ).join("");

  if(
    [...$("category").options]
      .some(o => o.value === atual)
  ){
    $("category").value = atual;
  }

}

function applyFilters(){

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const cat =
    $("category").value;

  filtered =
    products.filter(p => {

      const texto = [
        p.name,
        p.brand,
        p.category,
        p.description,
        p.price
      ]
      .join(" ")
      .toLowerCase();

      const busca =
        !q ||
        texto.includes(q);

      const categoria =
        cat === "Todos" ||
        p.category === cat;

      return busca && categoria;

    });

  renderProducts();

}

function productText(p){

  return encodeURIComponent(
    `Olá, Dan Cell! Tenho interesse no produto: ${p.name}. Poderia me passar mais informações?`
  );

}

function renderProducts(){

  $("count").textContent =
    `${filtered.length} ${
      filtered.length === 1
      ? "item"
      : "itens"
    }`;

  if(!filtered.length){

    $("grid").innerHTML =
      '<div class="empty">Nenhum produto encontrado.</div>';

    return;

  }

  $("grid").innerHTML =
    filtered.map(p => {

      const imagem =
        p.image
        ? `<img
             src="${esc(p.image)}"
             alt="${esc(p.name)}"
             loading="lazy"
             onerror="this.style.display='none'">`
        : "";

      return `

        <article class="card">

          <div class="photo">

            ${imagem}

            <span class="badge">
              ${esc(p.brand || p.category)}
            </span>

          </div>

          <div class="body">

            <h3 class="name">
              ${esc(p.name)}
            </h3>

            <div class="desc">
              ${esc(
                p.description ||
                "Consulte detalhes com a Dan Cell."
              )}
            </div>

            <div class="price">
              ${esc(p.price || "Consulte")}
            </div>

            <div class="sub">
              ${esc(
                p.installment ||
                "Condições pelo WhatsApp"
              )}
            </div>

            <a
              class="wa"
              target="_blank"
              rel="noopener"
              href="https://wa.me/${WHATSAPP}?text=${productText(p)}">
              Pedir no WhatsApp
            </a>

          </div>

        </article>

      `;

    }).join("");

}

function openAdmin(){

  $("adminModal")
    .classList
    .add("open");

  $("adminModal")
    .setAttribute(
      "aria-hidden",
      "false"
    );

  document.body.style.overflow =
    "hidden";

  drawAdmin();

}

function closeAdmin(){

  $("adminModal")
    .classList
    .remove("open");

  $("adminModal")
    .setAttribute(
      "aria-hidden",
      "true"
    );

  document.body.style.overflow =
    "";

  editingId = null;

}

function drawAdmin(){

  const b = $("adminBody");

  if(!logged){

    b.innerHTML = `

      <div class="loginBox">

        <h2>
          Acesso do lojista
        </h2>

        <p>
          Digite o PIN administrativo.
        </p>

        <div class="stack">

          <input
            class="field"
            id="pin"
            type="password"
            inputmode="numeric"
            placeholder="PIN">

          <button
            class="btn btnPrimary"
            type="button"
            id="loginBtn">
            Entrar
          </button>

          <div class="notice">
            ${
              apiOnline
              ? "Catálogo conectado à API."
              : "API não respondeu."
            }
          </div>

        </div>

      </div>

    `;

    $("loginBtn")
      .addEventListener(
        "click",
        login
      );

    $("pin")
      .addEventListener(
        "keydown",
        e => {

          if(e.key === "Enter"){
            login();
          }

        }
      );

    return;

  }

  if(editingId !== null){

    drawProductForm();

    return;

  }

  b.innerHTML = `

    <div class="adminActions">

      <button
        class="btn btnBlue"
        id="newProductBtn">
        + Novo produto
      </button>

      <button
        class="btn btnGhost"
        id="refreshBtn">
        Atualizar catálogo
      </button>

      <button
        class="btn btnDanger"
        id="logoutBtn">
        Sair
      </button>

    </div>

    <div class="adminList">

      ${
        products.map(p => `

          <div class="adminItem">

            <img
              src="${esc(p.image || "")}"
              alt=""
              onerror="this.style.visibility='hidden'">

            <div>

              <b>
                ${esc(p.name)}
              </b>

              <div class="muted">
                ${esc(p.category)}
                •
                ${esc(p.price || "Consulte")}
              </div>

            </div>

            <div class="itemBtns">

              <button
                class="btnGhost editBtn"
                data-id="${esc(p.id)}">
                Editar
              </button>

              <button
                class="btnDanger deleteBtn"
                data-id="${esc(p.id)}">
                Excluir
              </button>

            </div>

          </div>

        `).join("")
      }

    </div>

  `;

  $("newProductBtn").onclick = () => {

    editingId = "new";

    drawAdmin();

  };

  $("refreshBtn").onclick =
    async () => {

      await loadProducts();

      drawAdmin();

      toast(
        "Catálogo atualizado."
      );

    };

  $("logoutBtn").onclick = () => {

    logged = false;
    adminPin = "";
    editingId = null;

    drawAdmin();

  };

  b.querySelectorAll(".editBtn")
    .forEach(btn => {

      btn.onclick = () => {

        editingId =
          btn.dataset.id;

        drawAdmin();

      };

    });

  b.querySelectorAll(".deleteBtn")
    .forEach(btn => {

      btn.onclick = () => {

        deleteProduct(
          btn.dataset.id
        );

      };

    });

}

/* LOGIN CORRIGIDO */

async function login(){

  const pin =
    $("pin")
      .value
      .trim();

  if(!pin){

    toast(
      "Digite o PIN."
    );

    return;

  }

  try{

    const r = await fetch(
      "/api/products?action=login",
      {

        method:"POST",

        headers:{

          "Content-Type":
            "application/json",

          "x-admin-pin":
            pin

        },

        body:
          JSON.stringify({
            pin
          })

      }
    );

    const data =
      await r
        .json()
        .catch(() => ({}));

    if(!r.ok){

      throw new Error(
        data.error ||
        "PIN incorreto"
      );

    }

    adminPin = pin;

    logged = true;

    drawAdmin();

    toast(
      "Acesso liberado."
    );

  }catch(error){

    toast(
      error.message ||
      "Não foi possível entrar."
    );

  }

}

function drawProductForm(){

  const isNew =
    editingId === "new";

  const p =
    isNew
    ? {
        id:"",
        name:"",
        brand:"",
        category:"",
        description:"",
        price:"",
        installment:"",
        image:""
      }
    : products.find(
        item =>
          String(item.id) ===
          String(editingId)
      );

  if(!p){

    editingId = null;

    drawAdmin();

    return;

  }

  $("adminBody").innerHTML = `

    <div class="formTitle">

      ${
        isNew
        ? "Novo produto"
        : "Editar produto"
      }

    </div>

    <div class="stack">

      <div class="row">

        <input
          class="field"
          id="fName"
          placeholder="Nome do produto"
          value="${esc(p.name)}">

        <input
          class="field"
          id="fBrand"
          placeholder="Marca"
          value="${esc(p.brand)}">

      </div>

      <div class="row">

        <input
          class="field"
          id="fCategory"
          placeholder="Categoria"
          value="${esc(p.category)}">

        <input
          class="field"
          id="fPrice"
          placeholder="Preço ou condição"
          value="${esc(p.price)}">

      </div>

      <input
        class="field"
        id="fInstallment"
        placeholder="Parcelamento"
        value="${esc(p.installment)}">

      <input
        class="field"
        id="fImage"
        placeholder="URL da imagem"
        value="${esc(p.image)}">

      <textarea
        class="field"
        id="fDescription"
        rows="4"
        placeholder="Descrição">${esc(p.description)}</textarea>

      <div class="row">

        <button
          class="btn btnGhost"
          id="cancelEditBtn">
          Voltar
        </button>

        <button
          class="btn btnPrimary"
          id="saveProductBtn">

          ${
            isNew
            ? "Adicionar produto"
            : "Salvar alterações"
          }

        </button>

      </div>

    </div>

  `;

  $("cancelEditBtn").onclick = () => {

    editingId = null;

    drawAdmin();

  };

  $("saveProductBtn").onclick =
    submitProduct;

}

async function submitProduct(){

  const payload = {

    name:
      $("fName").value.trim(),

    brand:
      $("fBrand").value.trim(),

    category:
      $("fCategory").value.trim(),

    price:
      $("fPrice").value.trim(),

    installment:
      $("fInstallment")
        .value
        .trim(),

    image:
      $("fImage")
        .value
        .trim(),

    description:
      $("fDescription")
        .value
        .trim()

  };

  if(!payload.name){

    toast(
      "Digite o nome do produto."
    );

    return;

  }

  const isNew =
    editingId === "new";

  if(!isNew){

    payload.id =
      editingId;

  }

  try{

    const r = await fetch(
      "/api/products",
      {

        method:"PUT",

        headers:{

          "Content-Type":
            "application/json",

          "x-admin-pin":
            adminPin

        },

        body:
          JSON.stringify({

            action:
              isNew
              ? "create"
              : "update",

            product:
              payload

          })

      }
    );

    const data =
      await r
        .json()
        .catch(() => ({}));

    if(!r.ok){

      throw new Error(
        data.error ||
        "Não foi possível salvar."
      );

    }

    editingId = null;

    await loadProducts();

    drawAdmin();

    toast(
      isNew
      ? "Produto adicionado."
      : "Produto atualizado."
    );

  }catch(error){

    toast(
      error.message ||
      "Erro ao salvar."
    );

  }

}

async function deleteProduct(id){

  if(
    !confirm(
      "Excluir este produto?"
    )
  ){
    return;
  }

  try{

    const r = await fetch(
      "/api/products",
      {

        method:"PUT",

        headers:{

          "Content-Type":
            "application/json",

          "x-admin-pin":
            adminPin

        },

        body:
          JSON.stringify({

            action:"delete",

            id:id

          })

      }
    );

    const data =
      await r
        .json()
        .catch(() => ({}));

    if(!r.ok){

      throw new Error(
        data.error ||
        "Não foi possível excluir."
      );

    }

    await loadProducts();

    drawAdmin();

    toast(
      "Produto excluído."
    );

  }catch(error){

    toast(
      error.message ||
      "Erro ao excluir."
    );

  }

}

$("openAdminBtn")
  .addEventListener(
    "click",
    openAdmin
  );

$("closeAdminBtn")
  .addEventListener(
    "click",
    closeAdmin
  );

$("adminModal")
  .addEventListener(
    "click",
    e => {

      if(
        e.target ===
        $("adminModal")
      ){

        closeAdmin();

      }

    }
  );

$("search")
  .addEventListener(
    "input",
    applyFilters
  );

$("category")
  .addEventListener(
    "change",
    applyFilters
  );

loadProducts();

</script>
